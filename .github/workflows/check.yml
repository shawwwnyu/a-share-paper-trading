name: check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shawwwnyu/agent-autoloop
          ref: c9ec4a187cab49627947e7e33db265ec143db3b8
          path: .integration/agent-autoloop
      - run: npm run test:integration
        env:
          AGENT_AUTOLOOP_REPO: ${{ github.workspace }}/.integration/agent-autoloop
